<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Tasks</title>
</head>
<body>
    <header>
        <p>WWE Musterprojekt</p>
        <h1>Meine Tasks</h1>
        <p>Aufgaben erfassen und den Überblick behalten.</p>
    </header>
    <main>
        <section>
            <h2>Neuer Task</h2>
            <form action="">
                <p><label for="title">Titel</label></p>
                <p><input type="text" id="title" name="title" required="required"></p>
            </form>
        </section>
        <section>
            <h2>Offene Tasks</h2>
            <textarea name="description" id="description" rows="3"></textarea>
        </section>
        <section>
            <h2>Erledigt</h2>
        </section>
    </main>
    <footer></footer>
</body>
</html>
